<!DOCTYPE html>

<head>

  <meta name="description" content="Спасибо, ваша заявка отправлена — администратор клиники свяжется с вами в течение 15 минут.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://hs-planet.ru/thanks/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Заявка принята | Планета здоровой кожи">
  <meta property="og:description" content="Спасибо! Администратор свяжется с вами в течение 15 минут.">

  <!-- Favicons -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180x180.png">
  <meta name="theme-color" content="#44C8D2">
  <!--
    На thanks.html не грузим Метрику и Top.Mail.Ru: счётчики цели «отправка формы»
    удобнее вешать на DataLayer/SendForm event внутри основной страницы. Страница
    закрыта от индексации, трекинг здесь даёт только шум.

    Страница подключает /src/main.js (ради очистки корзины и общих модулей), а он
    теперь содержит analytics.js. Мета-тег ниже — явный опт-аут, иначе счётчики
    включились бы здесь сами при уже данном согласии на cookies.
  -->
  <meta name="pzk-analytics" content="off">

  <!-- Очистка корзины после успешного заказа. Пробрасываем в ранний inline-скрипт,
       чтобы не зависеть от загрузки основного бандла и SW. -->
  <script>
    try {
      // Ключ должен совпадать с STORAGE_KEY в src/js/modules/shop.js
      localStorage.removeItem('pzk_cart_v1');
    } catch (_) { /* приватный режим или заблокированное хранилище — ок */ }
  </script>
</head>

      <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">

      <p class="text-lg text-gray-600 mb-8 leading-relaxed">
          Ваша заявка успешно отправлена.<br>
          Наш администратор свяжется с вами в течение 15 минут (в рабочее время).
      </p>

      <a href="/" class="inline-block w-full bg-brand-turquoise text-white font-bold py-4 rounded-xl hover:bg-brand-tiffany transition shadow-lg uppercase tracking-widest text-sm">
        Вернуться на главную
      </a>
  </main>
