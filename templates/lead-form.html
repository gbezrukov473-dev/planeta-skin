<form
  id="lead-form{{ID_SUFFIX}}"
  class="js-lead-form space-y-5"
  method="post"
  action="/send-form/index.php"
  novalidate
  data-form-id="{{FORM_ID}}"
  data-service="{{SERVICE}}"
  data-thanks="/thanks/"
>
  <!-- Honeypot -->
  <input type="text" name="website" tabindex="-1" autocomplete="off" class="hidden" aria-hidden="true">

  <!-- Телефон -->
  <div>
    <label for="lead-phone{{ID_SUFFIX}}" class="sr-only">Телефон</label>
    <input
      id="lead-phone{{ID_SUFFIX}}"
      name="phone"
      type="tel"
      inputmode="tel"
      autocomplete="tel"
      placeholder="Номер телефона"
      class="mask-phone w-full p-4 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-brand-turquoise focus:ring-2 focus:ring-brand-turquoise/20 transition"
      required
    >
    <p class="mt-2 text-xs text-red-600 hidden" data-error-for="phone"></p>
  </div>

  <!-- Имя (опционально) -->
  <div>
    <label for="lead-name{{ID_SUFFIX}}" class="sr-only">Как к вам обращаться</label>
    <input
      id="lead-name{{ID_SUFFIX}}"
      name="name"
      type="text"
      autocomplete="name"
      placeholder="Как к вам обращаться (необязательно)"
      class="w-full p-4 rounded-xl border border-gray-200 bg-gray-50 outline-none focus:border-brand-turquoise focus:ring-2 focus:ring-brand-turquoise/20 transition"
      minlength="2"
      maxlength="60"
    >
    <p class="mt-2 text-xs text-red-600 hidden" data-error-for="name"></p>
  </div>

  <!-- Способ связи (звонок / Max) -->
  <div>
    <div class="text-xs font-semibold text-gray-600">Как связаться?</div>

    <div class="mt-2 grid grid-cols-2 gap-2" role="radiogroup" aria-label="Способ связи">
      <button
        type="button"
        class="method-btn rounded-xl border p-3 text-xs font-bold uppercase tracking-wide transition bg-brand-turquoise text-white border-brand-turquoise"
        data-method="call"
        role="radio"
        aria-checked="true"
      >
        <svg class="icon mr-2" aria-hidden="true"><use href="/img/icons.svg#i-phone-alt"></use></svg>Звонок
      </button>

      <button
        type="button"
        class="method-btn rounded-xl border p-3 text-xs font-bold uppercase tracking-wide transition bg-gray-50 text-gray-700 border-gray-200"
        data-method="max"
        role="radio"
        aria-checked="false"
      >
        <img src="/img/max-logo.svg" alt="" class="w-4 h-4 mr-2 inline-block align-middle max-logo-icon">Max
      </button>
    </div>

    <input type="hidden" name="contact_method" value="call">
  </div>

  <!-- Комментарий (опционально) -->
  <details class="group rounded-xl border border-gray-200 bg-gray-50 p-4">
    <summary class="cursor-pointer text-sm font-semibold text-gray-700 select-none">
      Есть вопрос? Напишите
      <span class="ml-2 text-xs text-gray-400 group-open:hidden">(необязательно)</span>
    </summary>
    <div class="pt-3">
      <label for="lead-comment{{ID_SUFFIX}}" class="sr-only">Коротко: что беспокоит?</label>
      <textarea
        id="lead-comment{{ID_SUFFIX}}"
        name="comment"
        rows="3"
        placeholder="Коротко: что беспокоит?"
        class="w-full resize-none rounded-xl border border-gray-200 bg-white p-3 outline-none focus:border-brand-turquoise focus:ring-2 focus:ring-brand-turquoise/20 transition"
      ></textarea>
    </div>
  </details>

  <!-- (Опционально) строка с услугой -->
  <div class="hidden text-xs text-gray-500" data-service-row>
    Услуга: <span class="font-semibold text-gray-700" data-service-label></span>
  </div>

  <!-- Согласие -->
  <div>
    <div class="flex items-center gap-3">
      <input
        id="lead-consent{{ID_SUFFIX}}"
        name="consent"
        type="checkbox"
        required
        class="h-4 w-4 rounded border-gray-300 text-brand-turquoise focus:ring-brand-turquoise"
      >
      <label for="lead-consent{{ID_SUFFIX}}" class="text-xs text-gray-500 leading-snug">
        Согласен на обработку персональных данных и ознакомлен(а) с
        <a href="/policy/" class="underline hover:text-brand-turquoise transition">политикой</a>.
      </label>
    </div>
    <p class="mt-2 text-xs text-red-600 hidden" data-error-for="consent"></p>
  </div>

  <p class="text-xs text-gray-500">
    Не спамим. Только по записи. Ответит администратор клиники.
  </p>

  <!-- Общие сообщения -->
  <div class="hidden rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700" data-form-error></div>
  <div class="hidden rounded-xl border border-green-200 bg-green-50 p-4 text-sm text-green-800" data-form-success></div>

  <!-- Скрытые поля -->
  <input type="hidden" name="page" value="">
  <input type="hidden" name="service" value="{{SERVICE}}">
  <input type="hidden" name="policy_version" value="2025-12-12">
  <input type="hidden" name="referrer" value="">
  <input type="hidden" name="form_id" value="{{FORM_ID}}">
  <input type="hidden" name="fill_time_ms" value="">

  <input type="hidden" name="utm_source" value="">
  <input type="hidden" name="utm_medium" value="">
  <input type="hidden" name="utm_campaign" value="">
  <input type="hidden" name="utm_content" value="">
  <input type="hidden" name="utm_term" value="">
  <input type="hidden" name="gclid" value="">
  <input type="hidden" name="yclid" value="">

  <!-- Yandex SmartCaptcha (invisible). Рендерится из forms.js по data-captcha-host.
       SDK сам инжектит внутрь host-дива hidden input name="smart-token" с токеном —
       свой добавлять НЕ надо, иначе PHP возьмёт последний (пустой) и капча провалится. -->
  <div data-captcha-host id="captcha-host{{ID_SUFFIX}}"></div>

  <button
    type="submit"
    class="w-full bg-brand-peach text-brand-dark font-bold p-4 rounded-xl hover:bg-brand-turquoise hover:text-white transition shadow-lg transform hover:-translate-y-1 uppercase tracking-widest text-sm"
  >
    Жду звонка
  </button>

  <p class="text-[10px] text-gray-400 mt-2 text-center">
    Нажимая кнопку, вы подтверждаете согласие на <a href="/policy/" class="underline hover:text-brand-turquoise transition">обработку персональных данных</a>.
  </p>
</form>
